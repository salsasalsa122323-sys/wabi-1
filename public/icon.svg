<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="496" height="496" x="8" y="8" rx="120" fill="none" stroke="url(#gold)" stroke-width="4" stroke-opacity="0.3"/>
  
  <!-- Outer Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#gold)" stroke-width="8" stroke-dasharray="12 8" opacity="0.4"/>
  
  <!-- Center Scale / ERP Icon -->
  <g transform="translate(136, 126)">
    <!-- Scale Beam -->
    <rect x="20" y="50" width="200" height="12" rx="6" fill="url(#gold)"/>
    <!-- Center Pillar -->
    <rect x="114" y="20" width="12" height="180" rx="6" fill="url(#gold)"/>
    <circle cx="120" cy="20" r="14" fill="url(#gold)"/>
    <rect x="80" y="195" width="80" height="16" rx="8" fill="url(#gold)"/>
    
    <!-- Left Pan (Store In) -->
    <line x1="30" y1="56" x2="30" y2="120" stroke="url(#gold)" stroke-width="4"/>
    <line x1="30" y1="56" x2="60" y2="120" stroke="url(#gold)" stroke-width="4"/>
    <path d="M10,120 Q45,150 80,120 Z" fill="url(#emerald)"/>
    
    <!-- Right Pan (Branch Out) -->
    <line x1="210" y1="56" x2="180" y2="120" stroke="url(#gold)" stroke-width="4"/>
    <line x1="210" y1="56" x2="210" y2="120" stroke="url(#gold)" stroke-width="4"/>
    <path d="M160,120 Q195,150 230,120 Z" fill="url(#emerald)"/>
  </g>
  
  <!-- Ethiopian Star Accent -->
  <path d="M256,70 L264,90 L286,90 L268,102 L275,122 L256,110 L237,122 L244,102 L226,90 L248,90 Z" fill="url(#gold)"/>
</svg>
